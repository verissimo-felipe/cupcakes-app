[project]
name = "cupcakes-backend"
version = "0.1.0"
description = "API da loja de cupcakes - Situacao Problema 2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]


[tool.ruff]
line-length = 88
target-version = "py311"

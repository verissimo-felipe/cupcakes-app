# Configuracao do Alembic.
#
# Repare que `sqlalchemy.url` esta VAZIO. Isso e intencional: a URL do
# banco vem de `app/core/config.py`, que le do ambiente. Duplicar a string
# de conexao aqui significaria (a) duas fontes de verdade que divergem, e
# (b) credenciais versionadas no Git. O `migrations/env.py` preenche esse
# valor em tempo de execucao.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
